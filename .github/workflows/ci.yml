name: Bootstrap validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    # A Postgres service container, not a Supabase project. A shared test database is fought over by
    # concurrent runs — one job's db-reset-test drops what another is asserting against — and the
    # failures are intermittent and expensive to chase. A container is per-run and isolated.
    #
    # What it CANNOT establish is stated in db/foundation/ci/supabase-shim.sql: the platform roles
    # here are ones we created, so a green run means "the policies still do what they did", never
    # "this works on Supabase". The measurement that decided DATA-DEC-03 — that service_role ships
    # with BYPASSRLS — can only come from a provisioned instance.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thinkbizthai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # The branch-scope guard diffs against the pull request's base, so the base commit
          # must be in the clone. A shallow checkout has only the head.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Clean install
        run: npm ci --ignore-scripts
      # Invoked BY THE WORKFLOW, not by the script it audits. `npm run check` can be
      # neutered by its own scripts.check string -- a trailing `&` backgrounds the chain so
      # the shell returns 0 before any exit code matters, and replacing every `&&` with `||`
      # short-circuits at step 1; the guard runs and rejects with exit 81, and `||` discards that exit code. A guard invoked by a
      # command cannot constrain the command that invokes it. See RFC-2026-007.
      - name: Verify test-integrity guard
        run: node scripts/verify-test-coverage-floor.mjs
      - name: Validate repository bootstrap
        run: npm run check
      # `validate-work-package-ownership.mjs` checks what a manifest DECLARES. This checks what
      # the branch CHANGED. Both failures it exists for came through that gap: a rebase resolved
      # with `--theirs` on a file the base had just changed silently reverted it, and work done
      # while answering review findings accumulated twenty-six undeclared paths on one branch.
      #
      # It lives here rather than in `npm run check` for the reason RFC-2026-007 gives about the
      # guard above it: only the workflow knows the pull request's base. A script the repository
      # invokes on itself cannot.
      - name: Verify branch scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # The package is NOT derived from the branch name. Independent review eleven showed
          # both halves of that broken: an unparseable name skipped the guard entirely at
          # exit 0, and a parseable one SELECTED which manifest the branch is judged against --
          # rename to WP-0A-A0-001-anything and inherit the broadest writable paths in the
          # repository. A ref name is not evidence. The claim is made in the manifest, where it
          # appears in a diff, and this resolves the branch to the package that names it.
          # A Product Owner disposition belongs to no work package -- disposing an RFC is not a
          # package's act. CI found this the first time one was pushed. Such a branch is allowed
          # only if it changes decision-record status lines and nothing else, which is checked
          # before the package rules are reached.
          if package_id="$(node scripts/verify-branch-identity.mjs "$HEAD_REF")"; then
            :
          else
            identity_status=$?
            node scripts/verify-disposition-branch.mjs "$BASE_SHA" || exit "$identity_status"
            echo "branch scope: disposition branch, package rules do not apply"
            exit 0
          fi
          # `persist-credentials: false` means no fetch can authenticate, so the base has to
          # come from what the checkout already brought. With `fetch-depth: 0` the full history
          # is present and the merge-base of HEAD and the base branch is reachable by SHA --
          # which the pull_request event supplies directly.
          node scripts/verify-branch-scope.mjs "$BASE_SHA" "$package_id"

      # The database half, after `npm run check`, so a red suite fails first and this step's output
      # never has to be read to discover the repository is broken.
      #
      # DB_TEST_URL names the service container. It is not a secret: the container lives for the
      # length of this job, holds nothing, and is reachable from nowhere else. A real credential
      # would belong in repository secrets and would never appear in a workflow file.
      - name: Database foundation
        env:
          # The password is NOT in the URL. The secret scanner flags an inline database password
          # wherever it appears, and it was right to: this one is a throwaway container credential,
          # but a rule that makes exceptions for credentials someone judges harmless stops being a
          # rule. psql reads PGPASSWORD from the environment, so the URL carries no secret shape and
          # the scanner has nothing to match.
          PGPASSWORD: postgres
          DB_TEST_URL: postgresql://postgres@localhost:5432/thinkbizthai_test
        run: |
          # The shim first: the migrations reference auth.uid() and the platform roles, and a bare
          # Postgres has neither. It declares in its own header that it is not Supabase.
          psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -q -f db/foundation/ci/supabase-shim.sql
          LC_ALL=C TZ=UTC make db-migrate-clean
          LC_ALL=C TZ=UTC make db-schema-lint
          # The isolation cases. This is the step that turns "we measured it once" into "a
          # regression fails the build", which is the difference between a measurement and a
          # control. Read its output with the shim's header in mind: it proves the POLICIES, not
          # the platform.
          LC_ALL=C TZ=UTC make db-rls-smoke

      # The negative control. A green isolation suite is not evidence until the suite can be made
      # to go red, and everything this branch found was a case passing for a reason nobody had
      # checked: a driver that could not name a column, and a parser counting the `set_config` row
      # from assuming an identity as a visible tenant row. Twenty-one cases were "passing" through
      # both.
      #
      # So the last thing the job does is switch row level security OFF on one table and require
      # the suite to FAIL, naming a failed case rather than merely exiting non-zero -- a fixture
      # that did not load also exits non-zero, and would let this control pass while proving
      # nothing.
      #
      # It runs last because it mutates the database. The container is discarded with the job.
      # The negative control, one per table family rather than one for the repository.
      #
      # The single-table version reported "10 of 28" and then "10 of 76" — the SAME ten, because
      # every one of them names app.workspaces. Batch 020 added 41 cases and the control could not
      # tell a working business/page policy from a broken one: it disabled RLS on a table those
      # cases never touch. A control that grows stale as the suite grows is worse than none, because
      # its number keeps being reported as though it meant something.
      #
      # So each entry disables RLS on ONE table and requires a failed case whose id matches that
      # table's own pattern. Requiring the pattern is the whole point: "the suite failed" is
      # satisfied by any regression anywhere, including one this control did not cause.
      #
      # RLS is re-enabled after each entry, so the entries are independent. Without that, the second
      # control would pass on the first table still being off.
      - name: Negative control - each table family must be detectable on its own
        env:
          PGPASSWORD: postgres
          DB_TEST_URL: postgresql://postgres@localhost:5432/thinkbizthai_test
        run: |
          set -u
          fail() { echo "$1"; cat control.log; exit 1; }
          control() {
            table="$1"; pattern="$2"; batch="$3"
            psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -q -c "alter table $table disable row level security;"
            if LC_ALL=C TZ=UTC make db-rls-smoke > control.log 2>&1; then
              psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -q -c "alter table $table enable row level security;"
              fail "The isolation suite PASSED with row level security DISABLED on $table. Batch $batch's cases cannot detect the thing they exist to detect."
            fi
            psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -q -c "alter table $table enable row level security;"
            if ! grep -q 'db-rls-smoke: FAILED' control.log; then
              fail "The suite exited non-zero without reporting a failed isolation case. That is a broken run, not a detected regression, and it must not be read as this control passing."
            fi
            if ! grep -Eq "^  $pattern" control.log; then
              fail "The suite failed, but no case matching /$pattern/ did. Something failed; it was not $table. A control satisfied by any failure is satisfied by a regression it did not cause."
            fi
            # Count FAILED CASE LINES, which are `  <id> [covers] (phase): detail`. The first
            # version counted `^  .*(` and swept up the coverage report and the authz-proof lines
            # with them, so every number it printed was an upper bound presented as a count. A2
            # Industry found it by reading the output rather than the step. The control itself
            # greps ids and was never wrong; only the sentence about it was, which is the kind of
            # defect that survives longest.
            noticed=$(grep -Ec "^  [a-z0-9-]+ \[[^]]*\] \([a-z-]+\):" control.log)
            echo "  $table ($batch): $noticed case(s) noticed, including $(grep -Eo "^  $pattern[a-z0-9-]*" control.log | head -1 | tr -d ' ')"
          }
          echo "negative control: each table family must be detectable on its own"
          control app.workspaces              '[a-z0-9-]*workspace'  010
          control app.business_profiles       '[a-z0-9-]*business'   020
          control app.page_context_profiles   '[a-z0-9-]*page'       020
          # Batch 021's table, and the entry whose absence would have been the gap named above.
          # Disabling row level security here does not merely hide rows: every caller sees every
          # member's scope rows, so a narrowed member inherits somebody else's scope and stops being
          # narrowed, and the suspended member — who holds a scope row on purpose — starts seeing
          # one. `[a-z0-9-]*scope` is matched by both of those failures.
          control app.workspace_member_scopes '[a-z0-9-]*scope'      021
          # Batch 030's tenant table. Disabling row level security here lets tenant A read tenant B's
          # industry assignment, lets a member scoped to one Business read another Business's, and
          # lets a suspended member and the service identity read rows they must not see. Four cases
          # match the pattern and would fail.
          control app.industry_assignments    '[a-z0-9-]*industry-assignment' 030
          #
          # THE TWO GLOBAL TABLES, AND WHY AN ENTRY FOR THEM BITES AT ALL. Every entry above works
          # because disabling row level security dissolves a TENANT BOUNDARY and somebody sees
          # somebody else's rows. app.industry_packs and app.industry_pack_versions have no tenant
          # boundary to dissolve: they belong to no workspace, and batch 030 grants no client role
          # any privilege on them at all (RFC-2026-012 §2/3 — the read allowlist is empty and grows
          # only by RFC). Every client case against them is a PRIVILEGE-layer refusal, and disabling
          # row level security does not restore a grant nobody made, so none of those cases would
          # notice.
          #
          # What makes the entries bite is the one grant that does exist: `app_worker` holds SELECT
          # and NO POLICY, which is the shape batch 010 introduced so that a service denial is
          # attributable to row level security rather than to a forgotten GRANT. With RLS off, the
          # service reads the catalog and `service-sees-zero-*` fails. So each of these entries rests
          # on exactly ONE case rather than several — stated here rather than left to be discovered,
          # because a control resting on one case is one deletion away from resting on none, and
          # tests/db/identity/identity-isolation.test.mjs is what refuses that deletion.
          control app.industry_packs          '[a-z0-9-]*industry-pack-catalog'  030
          control app.industry_pack_versions  '[a-z0-9-]*published-pack-version' 030
          #
          # THE TWO KNOWLEDGE TABLES, AND WHAT EACH ENTRY ACTUALLY RESTS ON. Batch 030 recorded
          # that a global table's entry rests on ONE case, and said so because a control resting on
          # one case is one deletion away from resting on none. Neither of these does, and what each
          # rests on is named here rather than left to be counted from the suite.
          #
          # app.knowledge_items rests on SIX RLS-decided cases, and they fail for three different
          # reasons. Disabling row level security there lets tenant A read tenant B's knowledge —
          # which on this family is CONTENT-2, what a business SAYS rather than what it is called;
          # it lets a member scoped to one Business read another Business's knowledge; it lets a
          # member scoped to ONE PAGE read a sibling Page's, which no other table in this schema can
          # detect, because a knowledge row is the first that carries its own page scope; and it
          # lets the approver's refused UPDATE land, which the witness then sees.
          #
          # app.knowledge_item_versions rests on FIVE, and one of them is the reason that table is
          # shaped the way it is: its narrowing is not a copy of the item's predicate but the item's
          # own reachability, so `page-editor-a-cannot-see-the-knowledge-version-of-the-sibling-page`
          # is the case that fails if the version ever started answering from its own columns —
          # which it could not do correctly, since it carries no page column at all.
          #
          # The two patterns do not overlap: an item case id contains `knowledge-item` and a version
          # case id contains `knowledge-version`, and tests/db/identity/identity-isolation.test.mjs
          # asserts that no case matches both, so neither entry can be satisfied by the other
          # table's regression.
          #
          # BATCH 041 ADDS NO ENTRY, BECAUSE IT ADDS NO TABLE. It creates one function —
          # app.knowledge_scope_applies, the scope half of the resolution rule — and nothing that
          # row level security can be switched off on. Saying so here rather than nowhere is the
          # point: this step's own blocker is that nothing fails the build when a batch adds a table
          # and no entry, so "041 owes no entry" is a claim that should be visible at the place the
          # entries live. identity-isolation.test.mjs holds it, by requiring that NO control entry is
          # attributed to batch 041 and that the migration creates no table.
          #
          # WHAT 041 DOES CHANGE IS WHAT THE app.knowledge_items ENTRY RESTS ON. It adds four more
          # cases that fail with row level security disabled there, and they are worth naming
          # because they fail through a NEW PATH rather than for a new reason: each one runs the
          # resolution contract as a filter, the predicate answers TRUE for the row, and only the
          # policy set refuses. `owner-a-cannot-resolve-the-knowledge-item-of-business-b1` is the
          # tenant boundary, `page-editor-a-cannot-resolve-the-knowledge-item-of-the-sibling-page`
          # is member scope at Page granularity, and `suspended-a-resolves-zero-knowledge-items` and
          # `service-resolves-zero-knowledge-items` are the suspended member and the service.
          #
          # THAT PARAGRAPH WAS A DERIVATION WHEN IT WAS WRITTEN AND IS NOW A MEASUREMENT, read from
          # this step's own output: main at batch 040 reported `app.knowledge_items (040): 24
          # case(s) noticed` and this branch reports 28. EXACTLY +4, against +7 new `no-rows` cases
          # matching the pattern -- so the three predicate negatives really did not move it, which
          # is the half of the claim below that a reader would otherwise take on trust. And
          # app.knowledge_item_versions is UNCHANGED at 9, which is the other half: 041 asserts
          # nothing about that table, so an entry that had grown there would have meant a case
          # crediting a control it does not test.
          #
          # 041's OTHER THREE negatives are NOT part of this basis and must not be counted as
          # though they were: `owner-a-does-not-resolve-the-sibling-page-knowledge-item-for-page-a1`
          # and its two siblings are refused by the PREDICATE, not by row level security, so they
          # return nothing whether the table is forced or wide open. They are paired instead with a
          # statement that differs in exactly one argument and returns the row.
          control app.knowledge_items         '[a-z0-9-]*knowledge-item'    040
          control app.knowledge_item_versions '[a-z0-9-]*knowledge-version' 040
          #
          # THE THREE ASYNC-KERNEL TABLES, AND WHY EACH ENTRY RESTS ON EXACTLY TWO CASES. Batch 030
          # recorded that a global table's entry rests on ONE case and said so because a control
          # resting on one case is one deletion away from resting on none. These three are the same
          # shape for a different reason and land on two rather than one, which is stated here
          # rather than left to be counted from the suite.
          #
          # Batch 050 grants NO CLIENT ROLE ANYTHING on any of its three tables: §8.4's "Job
          # redacted status SELECT" grants a REDACTED STATUS, which is a security_invoker view on
          # the read allowlist RFC-2026-012 §3 and RFC-2026-021 give to an RFC, and the outbox and
          # the consumer ledger have no row in §8 at all. So every client case against them is a
          # PRIVILEGE-layer refusal and disabling row level security restores no grant nobody made.
          #
          # What makes each entry bite is the pair of grants that DOES exist: app_worker holds
          # SELECT and INSERT (and, on app.jobs, UPDATE) with NO POLICY, which is the shape batch
          # 010 introduced so that a service denial is attributable to row level security rather
          # than to a forgotten GRANT. With RLS off, `service-sees-zero-*` returns the row AND
          # `service-cannot-*` succeeds where it must be refused — a filtered read and a policy-layer
          # write refusal, which are the two outcomes disabling RLS actually changes. A `denied`
          # case whose layer is `grant` would pass unchanged and is not counted by
          # tests/db/identity/identity-isolation.test.mjs, which pins these six cases by id.
          #
          # The three patterns do not overlap — a job case id contains `job-row`, an outbox case id
          # `outbox-event` and a ledger case id `consumer-ledger` — and that test asserts no case
          # matches two of them, so no entry can be satisfied by another table's regression.
          control app.jobs                    '[a-z0-9-]*job-row'         050
          control app.outbox_events           '[a-z0-9-]*outbox-event'    050
          control app.consumer_ledger         '[a-z0-9-]*consumer-ledger' 050
          # THE TWO AI GATEWAY TABLES IN `app`, AND THE THIRD TABLE THAT DELIBERATELY HAS NO ENTRY.
          # Batch 060 writes NO POLICY on any table it creates: §8 has no row for a model registry
          # or a model policy, so there is no cell to implement, and RFC-2026-012 with RFC-2026-021
          # puts the client read behind an allowlist that is empty. Every client case on these
          # tables is therefore a PRIVILEGE-layer refusal, which disabling row level security does
          # not restore — the same situation batch 030's two global tables are in.
          #
          # app.ai_models rests on ONE case, `service-sees-zero-rows-in-the-ai-model-registry`, for
          # 030's reason: app_worker holds SELECT and no policy, so that read is the only thing row
          # level security decides on the table. Stated here rather than left to be discovered,
          # because a control resting on one case is one deletion away from resting on none.
          #
          # app.ai_model_policies rests on TWO, and the second is a shape no earlier entry has.
          # `service-sees-zero-ai-model-policy-rows` is a filtered read. `service-cannot-set-an-ai-
          # model-policy` is a `denied` case refused at the POLICY layer — app_worker holds the
          # INSERT grant, so FORCE ROW LEVEL SECURITY with an empty policy set is what refuses the
          # row. Disabling row level security removes exactly that refusal: the 42501 the case
          # demands is gone, the statement is stopped (if at all) by the primary key with a
          # different SQLSTATE, and the case fails either way. Every other `denied` case in the
          # suite is a grant-layer refusal and would pass unchanged;
          # tests/db/identity/identity-isolation.test.mjs counts this one and says why.
          #
          # THERE IS NO ENTRY FOR private.ai_credential_references, AND THE ABSENCE IS THE FINDING
          # RATHER THAN AN OVERSIGHT. No role holds any privilege on that table — not a client role,
          # not app_worker — because RFC-2026-012's inventory says "no read by anyone, including
          # service" and §8.3's "Plain credential SELECT" is N in every column. Disabling row level
          # security there restores no grant, so no case would fail and this step's own first
          # failure message ("The isolation suite PASSED with row level security DISABLED") would
          # fire on a correct database. An entry that cannot bite reports a pass it did not earn.
          # The static suite asserts the absence IN BOTH DIRECTIONS: no entry while no migration
          # grants anything on that table, and an entry REQUIRED the moment one does.
          control app.ai_models               '[a-z0-9-]*ai-model-registry' 060
          control app.ai_model_policies       '[a-z0-9-]*ai-model-policy'   060
          # THE FOUR BILLING TABLES, AND THE ASYMMETRY BETWEEN THEM. Batch 130 creates one tenant
          # table and three global ones, so it carries both shapes this step has met, in one batch.
          #
          # app.billing_subscriptions is the tenant entry and it is the STRONGEST one here: six
          # RLS-decided cases match its pattern and they fail for three different reasons. Disabling
          # row level security there lets tenant A read tenant B's subscription — what another
          # business is paying and until when; it lets an ACTIVE EDITOR, APPROVER AND VIEWER of the
          # workspace read a row §8.3 marks `N` for their role, which no earlier table in this
          # schema can detect because every other SELECT row in §8 is `Y` for all five built-in
          # roles; and it lets the suspended member and the service identity read rows they must not
          # see.
          #
          # app.billing_plans, app.billing_plan_versions and app.plan_entitlements are the shape
          # batch 030 named. They belong to NO WORKSPACE, so there is no tenant boundary for this
          # control to dissolve, and batch 130 grants no client role any privilege on them at all
          # (RFC-2026-012 §2/3 and RFC-2026-021: the read allowlist is empty and grows only by RFC).
          # Every client case against them is a PRIVILEGE-layer refusal, and disabling row level
          # security does not restore a grant nobody made — so none of those cases would notice. The
          # entries bite through the ONE grant that exists: app_worker holds SELECT and no policy,
          # which is batch 010's shape for making a service denial attributable to RLS rather than to
          # a forgotten GRANT, so with RLS off the service reads the catalog and `service-sees-zero-*`
          # fails. EACH OF THOSE THREE ENTRIES THEREFORE RESTS ON EXACTLY ONE CASE, which is 030's
          # weakness repeated three times and is named rather than averaged:
          # tests/db/identity/identity-isolation.test.mjs pins each of those cases by id, by outcome
          # kind and by identity helper, so deleting one fails the build instead of leaving an entry
          # that disables something nothing notices.
          #
          # The four patterns do not overlap with each other or with any entry above: a subscription
          # case id contains `billing-subscription`, a catalog case `billing-plan-catalog`, a price
          # case `plan-price` and an entitlement case `plan-entitlement`, and none of them contains
          # `workspace`, `business`, `page`, `scope`, `industry-` or `knowledge-`. The static suite
          # asserts that pairwise, across every entry in this step, rather than leaving it to
          # inspection.
          control app.billing_subscriptions   '[a-z0-9-]*billing-subscription'   130
          control app.billing_plans           '[a-z0-9-]*billing-plan-catalog'   130
          control app.billing_plan_versions   '[a-z0-9-]*plan-price'             130
          control app.plan_entitlements       '[a-z0-9-]*plan-entitlement'       130
          # THE TWO AUDIT TABLES, AND A CORRECTION TO WHAT MAKES AN ENTRY BITE. Every entry above
          # rests on a FILTERED READ or a FILTERED WRITE — a case that returns nothing while row
          # level security is on and returns something when it is off. Batch 030 recorded that its
          # two global tables rest on exactly one such case each, and said so because a control
          # resting on one case is one deletion away from resting on none.
          #
          # These two rest on TWO cases each, and the second kind is one no earlier entry used: a
          # POLICY-LAYER REFUSED WRITE. app_worker holds SELECT and INSERT on both tables and NO
          # POLICY — §8.4 marks "Audit/security INSERT" `S` and RFC-2026-016 §2 conditions the
          # service policy on a workspace GUC that does not exist yet — so with row level security
          # ON the insert is refused by RLS, and with it OFF the grant is enough and the write
          # LANDS. `service-cannot-write-an-audit-log` therefore fails when this control disables
          # RLS, exactly as `service-sees-zero-audit-logs` does.
          #
          # No CLIENT case on either table would notice. No client role holds any privilege here at
          # all (RFC-2026-012 decision 2 with RFC-2026-021's empty allowlist), so every one of them
          # is a privilege-layer refusal that disabling row level security does not restore. That is
          # stated here rather than left to be counted, and
          # tests/db/identity/identity-isolation.test.mjs pins the four cases by id and by outcome
          # so deleting one fails the build instead of leaving an entry that disables something
          # nothing notices.
          #
          # The two patterns do not overlap: an audit case id contains `audit-log` and a security
          # case id contains `security-event`, and the same test asserts that no case matches both.
          control app.audit_logs              '[a-z0-9-]*audit-log'      140
          control app.security_events         '[a-z0-9-]*security-event' 140
          # THE TWO CONNECTOR TABLES IN `app`, THE TWO IN `private` THAT DELIBERATELY HAVE NO ENTRY,
          # AND A PATTERN CHOICE THAT IS ABOUT THIS STEP RATHER THAN ABOUT BATCH 110.
          #
          # Batch 110 writes NO POLICY on any table it creates. §8.3's "Meta connection health
          # SELECT" grants a HEALTH PROJECTION — §9.1 gives INTEGRATION-2 the client projection
          # "health projection only" — which is a security_invoker view on the read allowlist
          # RFC-2026-012 §3 and RFC-2026-021 give to an RFC; "Connect/disconnect/re-auth Meta" is a
          # command whose essential half is an OAuth exchange §3.4 forbids inside a transaction; and
          # "Raw token/webhook SELECT" is the `S` cell RFC-2026-022 §3 classifies DISCOVERED and §5/5
          # gives NO POLICY permanently. So every client case on these tables is a PRIVILEGE-layer
          # refusal that disabling row level security does not restore.
          #
          # EACH ENTRY RESTS ON EXACTLY TWO CASES, and they are the two kinds batch 140 established.
          # app_worker holds SELECT, INSERT and a column-scoped UPDATE on both tables and NO POLICY,
          # so with row level security ON `service-sees-zero-meta-connection-rows` and
          # `service-sees-zero-social-account-rows` read nothing and
          # `service-cannot-create-a-meta-connection` and `service-cannot-discover-a-social-account`
          # are refused AT THE POLICY LAYER — and with it OFF the reads return the fixture row and
          # both writes LAND. The two INSERTs name only columns app_worker is granted and rows that
          # satisfy every constraint, so nothing but RLS stands between them and the table; a
          # statement naming an ungranted column would be refused at the privilege layer and this
          # entry would rest on a case that never noticed.
          #
          # THERE IS NO ENTRY FOR private.meta_credential_references OR private.meta_webhook_inbox,
          # AND THE ABSENCE IS THE FINDING RATHER THAN AN OVERSIGHT — the same situation batch 060
          # recorded for private.ai_credential_references. No role holds any privilege on either:
          # §3.1 gives `private` "ไม่มี direct grant", §8.3's "Plain credential SELECT" is N in every
          # column including the service's, and RFC-2026-012's inventory says of the raw webhook
          # inbox "server-only … private, no direct grant". Disabling row level security there
          # restores no grant, so no case would fail and this step's own first failure message
          # ("The isolation suite PASSED with row level security DISABLED") would fire on a correct
          # database. tests/db/identity/identity-isolation.test.mjs asserts the absence IN BOTH
          # DIRECTIONS: no entry while no migration grants anything on those tables, and an entry
          # REQUIRED the moment one does.
          #
          # THE TWO PATTERNS DO NOT OVERLAP WITH EACH OTHER OR WITH ANY ENTRY ABOVE, and batch 110
          # went further than checking: NO case id it adds contains `workspace`, `business`, `page`
          # or `scope`. Those four are the patterns of pre-existing entries, the work package records
          # the overlap they already cause (sixteen entry-pairs measured on batch 130's branch,
          # eighteen after 060 and 140 landed), and a batch whose ids matched another entry's pattern
          # would make that entry satisfiable by a regression it did not cause. That is why the
          # cross-tenant cases here say `of-tenant-b` where every earlier batch says `workspace-b`,
          # and the static suite asserts it pairwise across every entry in this step.
          control app.meta_connections        '[a-z0-9-]*meta-connection' 110
          control app.social_accounts         '[a-z0-9-]*social-account'  110
          # THE THREE METERING TABLES. Batch 061 creates one table a client may read and two that no
          # client role holds any privilege on, so it carries both of the shapes this step has met
          # before — and its client-readable entry rests on a kind of case the entries above do not
          # describe. What that kind is, is stated below rather than counted: this comment says what
          # each entry rests on and does not rank it against the others, because the count of entries
          # in this step is a property of the merged tree and no batch can check one.
          #
          # app.usage_events and app.usage_reservations are the shape batch 050 established. No
          # client role holds a privilege on either — §8.4 says nothing about who may SELECT a usage
          # event, and the reservation has no row in §8 at all — so every client case against them is
          # a PRIVILEGE-layer refusal that disabling row level security does not restore. Each entry
          # bites through the pair of grants that DOES exist: app_worker holds SELECT and INSERT with
          # NO POLICY, so with RLS off `service-sees-zero-*` returns the fixture row AND
          # `service-cannot-*` succeeds where it must be refused. THE LEDGER'S ENTRY RESTS ON TWO
          # CASES AND THE RESERVATION'S ON TWO, and each pair is one filtered read plus one
          # policy-layer refused write; the several `denied` cases beside them whose layer is `grant`
          # would pass unchanged and are not counted.
          #
          # app.quota_buckets IS THE ONE WITH A CLIENT READ, and that is where this step gains
          # something it does not have elsewhere. Six RLS-decided cases match its pattern and they
          # fail for FOUR different reasons when row level security is off, one of which no entry
          # above can produce today:
          #
          #   * the tenant boundary — workspace A's owner reads workspace B's quota bucket, which is
          #     what another business is spending;
          #   * the ROLE predicate — an active editor, approver and viewer of the workspace read a
          #     row §8.4 marks `N` for their role;
          #   * the suspended member and the service identity read rows they must not see;
          #   * and THE MEMBER-SCOPE NARROWING — `admin-a-cannot-read-the-quota-bucket-outside-their-
          #     narrowing` is refused by a RESTRICTIVE policy AFTER the caller has already passed the
          #     role predicate, so it fails because a policy SUBTRACTED rather than because none
          #     admitted. That is what it contributes to this entry: dropping the restrictive policy
          #     while keeping the permissive one leaves the other five cases of this basis green.
          #
          # There is also a `no-effect` case in the basis —
          # `service-cannot-rewrite-a-quota-bucket-total` — which is worth naming because its failure
          # with RLS off is a WITNESS seeing a changed value rather than an absent refusal:
          # app_worker holds a column-scoped UPDATE on the derived columns, so with the policies gone
          # the write lands and workspace A's owner reads the new number back.
          #
          # The three patterns do not overlap with each other or with any entry above: a ledger case
          # id contains `usage-event`, a reservation case `usage-reservation` and a bucket case
          # `quota-bucket`, and no case id in this batch contains `workspace`, `business`, `page`,
          # `scope`, `industry-`, `knowledge-`, `job-row`, `outbox-event`, `consumer-ledger`,
          # `ai-model-`, `billing-`, `plan-`, `audit-log` or `security-event`. The static suite
          # asserts that pairwise, across every entry in this step, rather than leaving it to
          # inspection.
          control app.usage_events            '[a-z0-9-]*usage-event'       061
          control app.usage_reservations      '[a-z0-9-]*usage-reservation' 061
          control app.quota_buckets           '[a-z0-9-]*quota-bucket'      061
          #
          # THE TWO NOTIFICATION TABLES IN `app`, AND THE ONE ENTRY IN THIS STEP THAT RESTS ON A
          # TENANT BOUNDARY A CLIENT CAN ACTUALLY SEE. On 050, 060, 130's plan catalog and 140 the
          # entry rests on a service read or a service write alone, because none of them grants a
          # client role anything and a privilege-layer refusal is not restored by disabling row level
          # security. §8.4's "Own notification SELECT/mark read" is `O` for all five built-in roles
          # and batch 051 implements it, so disabling row level security on app.notifications
          # dissolves TWO boundaries rather than one.
          #
          # WHAT DISABLING IT LETS THROUGH, which is the sentence a reader needs at the point of use:
          #
          #   * TENANT A READS TENANT B'S INBOX. `owner-a-cannot-see-the-notification-of-owner-b`
          #     and its write half fail.
          #   * A MEMBER READS ANOTHER MEMBER OF THEIR OWN WORKSPACE'S INBOX, THE OWNER INCLUDED.
          #     §5 scopes this family "workspace/user" and §8.4 gives the owner no more than the
          #     viewer, where §8.1 gives the owner and admin the member list and 011's roster policy
          #     implements it. `owner-a-cannot-see-the-notification-of-editor-a` and
          #     `editor-a-cannot-see-the-notification-of-owner-a` fail.
          #   * A SUSPENDED MEMBER READS AGAIN. The fixture addresses a notification TO
          #     user_suspended_a, so `suspended-a-sees-zero-notifications` is about a row that would
          #     become visible rather than about an empty table.
          #   * THE SERVICE READS AND WRITES. app_worker holds column-scoped grants and no policy —
          #     §8.4's `S` cell is classified CARRIED in db/foundation/lint/service-policy-map.json
          #     and RFC-2026-022 is approved and NOT IN EFFECT — so `service-sees-zero-notification-
          #     rows` returns the row and `service-cannot-write-a-notification-row` succeeds where it
          #     must be refused.
          #
          # TEN CASES MATCHING THE PATTERN ARE RESTORED BY DISABLING IT, and
          # tests/db/identity/identity-isolation.test.mjs pins five of them by id, by outcome and by
          # layer so deleting one fails the build rather than quietly thinning the entry.
          control app.notifications           '[a-z0-9-]*notification'   051
          #
          # AND app.notification_preferences RESTS ON EXACTLY ONE CASE, which is said here rather
          # than left to be counted. §8 has NO ROW for a notification preference in any of its four
          # matrices, so batch 051 grants no client role anything on it and every client case is a
          # privilege-layer refusal that disabling row level security does not restore. What makes
          # the entry bite is the single grant that does exist: app_worker holds a column-scoped
          # SELECT and no policy, so `service-sees-zero-channel-preference-rows` returns the row with
          # RLS off. The service is granted no INSERT — no document says a service sets a person's
          # preference, and a verb issued ahead of a caller is a verb nobody reviews against one — so
          # there is no second, policy-layer case to rest on, and this entry is in the state batch
          # 030 warned about: one deletion away from resting on none. The static suite pins that one
          # case by id, which is the refusal of that deletion.
          #
          # THE PATTERN IS `channel-preference` AND NOT `notification-preference` ON PURPOSE. The
          # entry above needs `[a-z0-9-]*notification`, which would match every id containing
          # `notification-preference` too, and this entry could then be satisfied by an inbox
          # regression it did not cause — the overlap batch 130 measured across the pre-existing
          # entries and could only report. Batch 051's case ids are named so that its own two
          # patterns are disjoint, which identity-isolation.test.mjs asserts over the whole merged
          # case set.
          control app.notification_preferences '[a-z0-9-]*channel-preference' 051
          #
          # THERE IS NO ENTRY FOR private.push_subscription_references, AND THE ABSENCE IS ASSERTED
          # IN BOTH DIRECTIONS. It is the same shape batch 060 established for
          # private.ai_credential_references and the reason is the same: NO ROLE HOLDS ANY PRIVILEGE
          # ON IT — not the client, not app_worker, not app_command, not app_maintenance, not
          # app_authz — and no role holds USAGE on schema `private`, because §9.1 lists "push token"
          # as an example of SECRET-4 and gives that class a client projection of "never returned
          # after write". Disabling row level security on that table therefore restores no grant, no
          # case would fail, and this step's own first failure message — "The isolation suite PASSED
          # with row level security DISABLED" — would fire on a correct database. An entry here would
          # report a pass it did not earn. identity-isolation.test.mjs requires the entry to be
          # ABSENT while no migration grants a privilege on a table in `private`, and REQUIRED the
          # moment one does.
          # THE THREE BILLING-PROJECTION TABLES, AND WHY ONE OF THEM RESTS ON A CASE THAT WILL
          # NEVER FLIP. Batch 131 grants NO CLIENT ROLE ANYTHING on any of its three tables: §8.3's
          # "Raw token/webhook SELECT" is `N` in all five client columns, and §8 has no row for an
          # invoice or a payment in any of its four matrices. So every client case against them is a
          # PRIVILEGE-layer refusal that disabling row level security does not restore, exactly as on
          # batches 050, 060 and 140.
          #
          # Each entry bites through the pair of grants that DOES exist: app_worker holds a
          # column-scoped SELECT and INSERT (and, on the receipt and the invoice, a column-scoped
          # UPDATE) with NO POLICY. With RLS off, `service-sees-zero-*` returns the row AND
          # `service-cannot-*` succeeds where it must be refused — a filtered read and a policy-layer
          # write refusal, which are the two outcomes disabling RLS actually changes. So each of these
          # three rests on TWO cases and neither is a `deniedBy: 'grant'` case, which would pass
          # unchanged; tests/db/identity/identity-isolation.test.mjs pins all six by id, by outcome
          # kind and by layer.
          #
          # THE RECEIPT'S PAIR IS PERMANENT AND THE OTHER TWO ARE PENDING, and the difference is
          # recorded here because it decides what a later batch is allowed to do to them.
          # app.billing_webhook_receipts holds §8.3's `S` cell, which RFC-2026-022 §3 classifies
          # DISCOVERED and §5/5 gives NO POLICY permanently — so `service-sees-zero-billing-webhook-
          # receipts` is an assertion that never flips, and RFC-2026-022 §8 warns that a reader who
          # treats it as pending will "fix" it by writing the unscoped service policy §4 option B
          # rejects. What flips instead is a new pair: a broker claim succeeds while the direct
          # statement still returns zero. app.billing_invoices and app.billing_payments have no §8 row
          # at all, so what would change theirs is an RFC-2026-021 allowlist entry — an owner reading
          # their own invoices is the strongest candidate this family produces and it fails C1 today.
          #
          # The three patterns do not overlap with each other or with any entry above: a receipt case
          # id contains `billing-webhook-receipt`, an invoice case `billing-invoice` and a payment case
          # `billing-payment`, none of them contains `billing-subscription`, `billing-plan-catalog`,
          # `plan-price` or `plan-entitlement`, and none contains `workspace`, `business`, `page`,
          # `scope`, `industry-`, `knowledge-`, `job-row`, `outbox-event`, `consumer-ledger`,
          # `ai-model-`, `audit-log` or `security-event`. The static suite asserts that pairwise across
          # every entry in this step rather than leaving it to inspection.
          control app.billing_webhook_receipts '[a-z0-9-]*billing-webhook-receipt' 131
          control app.billing_invoices         '[a-z0-9-]*billing-invoice'         131
          control app.billing_payments         '[a-z0-9-]*billing-payment'         131
          #
          # THE FIVE RESEARCH TABLES, AND THE ONE OF THEM WHOSE ENTRY RESTS ON A DIFFERENT KIND OF
          # CASE FROM THE OTHER FOUR. Batch 070 is the first family in this step to carry BOTH shapes
          # at once — four tables a client may read and one no client role holds anything on — and
          # what each entry rests on is stated below rather than counted, because the number of
          # entries in this step is a property of the merged tree and no batch can check one.
          #
          # app.research_runs, app.research_sources, app.research_evidence and
          # app.research_suggestions carry §8.2's "Knowledge/Research SELECT | Y | Y | Y | Y | Y", so
          # disabling row level security on any of them dissolves boundaries a CLIENT can see, and
          # each entry bites through several kinds of case at once rather than through one pair:
          #
          #   * THE TENANT BOUNDARY. `owner-a-cannot-see-the-research-run-of-tenant-b` and its three
          #     siblings on the source, the evidence and the suggestion return tenant B's rows.
          #   * THE MEMBER-SCOPE NARROWING, which is where these entries say something the entries
          #     above cannot. `editor-a-cannot-see-the-research-run-outside-their-narrowing` is
          #     refused by a RESTRICTIVE policy AFTER the caller has passed the permissive one, and
          #     `pinned-editor-a-cannot-see-the-research-source-of-a-sibling-target-run` is refused by
          #     that narrowing resolved THROUGH THE PARENT — a source carries no page column of its
          #     own, so its policy asks whether its run is reachable. Dropping the child's exists()
          #     while keeping everything else leaves that one case failing and the rest green.
          #   * THE ROLE PREDICATE ON TWO WRITE PATHS. `approver-a-cannot-cancel-a-research-run`,
          #     `viewer-a-cannot-cancel-a-research-run`, `approver-a-cannot-save-a-research-suggestion`
          #     and `viewer-a-cannot-save-a-research-suggestion` are `no-effect` cases whose failure
          #     with row level security off is a WITNESS reading a changed value rather than an absent
          #     refusal: `authenticated` holds the column-scoped UPDATE, so the write lands and the
          #     workspace's owner reads `cancelled` or `saved` back.
          #   * THE SUSPENDED MEMBER AND THE SERVICE. `suspended-a-sees-zero-*` and
          #     `service-sees-zero-*` return rows, and `service-cannot-start-a-research-run`,
          #     `-cite-a-research-source`, `-record-a-research-evidence-row` and
          #     `-propose-a-research-suggestion` succeed where they must be refused — app_worker holds
          #     the INSERT §8.2's `S` gives it and NO POLICY, and RFC-2026-022's decision is approved
          #     and NOT IN EFFECT.
          #
          # The several `denied` cases beside those whose layer is `grant` — every forged-actor case,
          # every immutability case, every client INSERT — pass unchanged with row level security off
          # and are NOT part of any of these bases.
          control app.research_runs           '[a-z0-9-]*research-run'        070
          control app.research_sources        '[a-z0-9-]*research-source'     070
          #
          # app.research_snapshots IS THE ONE WITH NO CLIENT READ AT ALL, and its entry rests on
          # EXACTLY TWO CASES — which is said here rather than left to be counted, because an entry
          # resting on two is one deletion away from resting on one and batch 030 established that
          # the count belongs beside the entry. §9.1 classes a research snapshot COPYRIGHT-3 with the
          # client projection "approved excerpt only", nothing in this repository defines an approval,
          # and §9.2 forbids a full research snapshot in a client surface at all — so batch 070 grants
          # no client role anything on it and every client case against it is a PRIVILEGE-layer
          # refusal that disabling row level security does not restore.
          #
          # What makes the entry bite is the pair of grants that does exist: app_worker holds a
          # column-scoped SELECT and INSERT with no policy, so with RLS off
          # `service-sees-zero-research-snapshots` returns the fixture capture AND
          # `service-cannot-capture-a-research-snapshot` succeeds where it must be refused.
          # tests/db/identity/identity-isolation.test.mjs pins both by id, by outcome kind and by
          # layer, which is the refusal of that deletion.
          #
          # THE THREE OTHER SERVICE CASES ON THIS TABLE ARE NOT IN THE BASIS AND THAT IS THE POINT OF
          # THEM. `service-cannot-extend-the-retention-of-a-research-snapshot`,
          # `-rewrite-the-digest-` and `-delete-` are `deniedBy: 'grant'`: `retention_until` and
          # `content_hash` are outside every UPDATE grant to every role and no role holds DELETE, so
          # they pass unchanged with row level security off. That is what they are for — DATA-DEC-07
          # is an OPEN decision (research snapshot retention, 30 days max default, owner
          # Research+Legal) and a retention limit a granted path could push forward would not be one,
          # so the control that keeps it is the absence of the privilege rather than a policy.
          control app.research_snapshots      '[a-z0-9-]*research-snapshot'   070
          control app.research_evidence       '[a-z0-9-]*research-evidence'   070
          control app.research_suggestions    '[a-z0-9-]*research-suggestion' 070
          #
          # BATCH 080's FIVE TABLES, AND WHAT EACH ENTRY ACTUALLY RESTS ON. §8.2 marks "Content
          # SELECT" `Y` for all five client roles, so every one of these families has client READS
          # for row level security to decide -- which is what an entry here needs, and what most of
          # this batch's write cases cannot supply: three of the five tables are immutable as an
          # ABSENCE OF GRANTS, so their write cases are privilege refusals that pass unchanged with
          # row level security off.
          #
          #   * THE TENANT BOUNDARY, on all five. `owner-a-cannot-see-the-content-item-of-tenant-b`
          #     and its four siblings hold tenant B's exact id and return nothing; the matching
          #     `owner-b-sees-...` cases prove the rows are there to be seen.
          #   * THE MEMBER SCOPE, resolved through a parent on three of them.
          #     `pinned-editor-a-cannot-see-the-content-version-of-a-sibling-target-item` and the
          #     variant and quality-review cases beside it are the ones that fail if the chain --
          #     variant through version through item, where the page lives -- is cut at its second
          #     link.
          #   * THE ROLE PREDICATE on the two client write paths.
          #     `approver-a-cannot-rename-a-content-item`, `viewer-a-cannot-rename-a-content-item`
          #     and the two idea cases beside them are `no-effect` cases whose failure with row
          #     level security off is the write LANDING, which their witnesses detect.
          #
          # NOT the `service-cannot-*` cases, on any of these five. Batch 080 grants app_worker
          # nothing at all -- the writer content needs is a SECURITY DEFINER function owned by
          # app_command, not a worker with privileges -- so those refusals are the privilege system
          # and are unmoved by this control. Batch 070's service cases ARE part of its basis for the
          # opposite reason: it grants its worker the verbs and lets row level security refuse them.
          control app.content_ideas           '[a-z0-9-]*content-idea'        080
          control app.content_items           '[a-z0-9-]*content-item'        080
          control app.content_versions        '[a-z0-9-]*content-version'     080
          control app.content_variants        '[a-z0-9-]*content-variant'     080
          control app.quality_reviews         '[a-z0-9-]*quality-review'      080
          #
          # BATCH 090's THREE TABLES, AND WHAT EACH ENTRY ACTUALLY RESTS ON. §8.3 gives approval NO
          # SELECT ROW AT ALL, so unlike every family above, these client reads rest on a reading
          # rather than on a matrix cell -- the approver's `Y` on the decide row, §5's CONTENT-2
          # beside AUTH-3, and §8.4's "approval trail". The reads exist, which is what an entry here
          # needs; the entry does not make the reading right, and the work package's open blockers
          # record that it is a reading.
          #
          #   * THE TENANT BOUNDARY, on all three. `owner-a-cannot-see-the-approval-policy-of-
          #     tenant-b` and its two siblings hold tenant B's exact address -- for the event, down
          #     to the idempotency key §4.7 makes unique -- and return nothing; the matching
          #     `owner-b-sees-...` cases prove the rows are there to be seen.
          #   * THE MEMBER SCOPE, resolved through a parent on two of them.
          #     `pinned-editor-a-cannot-see-the-approval-event-of-a-sibling-target-item` is the one
          #     that fails if the chain -- event through request through content item, where the
          #     page lives -- is cut at its SECOND link, and its positive twin
          #     `pinned-editor-a-sees-the-approval-event-of-a-reachable-item` is the same caller
          #     admitted two links down.
          #   * THE ROLE PREDICATE on the write paths. `editor-a-cannot-toggle-an-approval-policy`,
          #     `approver-a-cannot-toggle-an-approval-policy` and `viewer-a-cannot-cancel-an-
          #     approval-request` are `no-effect` cases whose failure with row level security off is
          #     the write LANDING, which their witnesses detect.
          #   * AND THE TWO CROSSED CASES, which are this batch's own shape and are `denied` rather
          #     than `no-effect`: `editor-a-cannot-decide-an-approval-request` and
          #     `approver-a-cannot-cancel-an-approval-request`. With row level security off both
          #     WITH CHECK halves stop applying and the write lands, so they are part of this basis
          #     -- the only cases in the suite that rest on a WITH CHECK half of one policy while
          #     the USING half of ANOTHER admits the row.
          #
          # NOT the `service-cannot-*` cases, on any of these three, and NOT the privilege refusals:
          # batch 090 grants app_worker nothing at all, and `status`, `version`, `minimum_approvers`
          # and `content_version_id` are refused by a missing column grant. Those pass unchanged
          # with row level security off. Batch 070's service cases ARE part of its basis for the
          # opposite reason: it grants its worker the verbs and lets row level security refuse them.
          control app.approval_policies       '[a-z0-9-]*approval-policy'     090
          control app.approval_requests       '[a-z0-9-]*approval-request'    090
          control app.approval_events         '[a-z0-9-]*approval-event'      090
          echo "negative control: every family above failed the suite, as each must."
