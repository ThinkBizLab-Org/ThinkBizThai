name: Bootstrap validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    # A Postgres service container, not a Supabase project. A shared test database is fought over by
    # concurrent runs — one job's db-reset-test drops what another is asserting against — and the
    # failures are intermittent and expensive to chase. A container is per-run and isolated.
    #
    # What it CANNOT establish is stated in db/foundation/ci/supabase-shim.sql: the platform roles
    # here are ones we created, so a green run means "the policies still do what they did", never
    # "this works on Supabase". The measurement that decided DATA-DEC-03 — that service_role ships
    # with BYPASSRLS — can only come from a provisioned instance.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thinkbizthai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # The branch-scope guard diffs against the pull request's base, so the base commit
          # must be in the clone. A shallow checkout has only the head.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Clean install
        run: npm ci --ignore-scripts
      # Invoked BY THE WORKFLOW, not by the script it audits. `npm run check` can be
      # neutered by its own scripts.check string -- a trailing `&` backgrounds the chain so
      # the shell returns 0 before any exit code matters, and replacing every `&&` with `||`
      # short-circuits at step 1; the guard runs and rejects with exit 81, and `||` discards that exit code. A guard invoked by a
      # command cannot constrain the command that invokes it. See RFC-2026-007.
      - name: Verify test-integrity guard
        run: node scripts/verify-test-coverage-floor.mjs
      - name: Validate repository bootstrap
        run: npm run check
      # `validate-work-package-ownership.mjs` checks what a manifest DECLARES. This checks what
      # the branch CHANGED. Both failures it exists for came through that gap: a rebase resolved
      # with `--theirs` on a file the base had just changed silently reverted it, and work done
      # while answering review findings accumulated twenty-six undeclared paths on one branch.
      #
      # It lives here rather than in `npm run check` for the reason RFC-2026-007 gives about the
      # guard above it: only the workflow knows the pull request's base. A script the repository
      # invokes on itself cannot.
      - name: Verify branch scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # The package is NOT derived from the branch name. Independent review eleven showed
          # both halves of that broken: an unparseable name skipped the guard entirely at
          # exit 0, and a parseable one SELECTED which manifest the branch is judged against --
          # rename to WP-0A-A0-001-anything and inherit the broadest writable paths in the
          # repository. A ref name is not evidence. The claim is made in the manifest, where it
          # appears in a diff, and this resolves the branch to the package that names it.
          # A Product Owner disposition belongs to no work package -- disposing an RFC is not a
          # package's act. CI found this the first time one was pushed. Such a branch is allowed
          # only if it changes decision-record status lines and nothing else, which is checked
          # before the package rules are reached.
          if package_id="$(node scripts/verify-branch-identity.mjs "$HEAD_REF")"; then
            :
          else
            identity_status=$?
            node scripts/verify-disposition-branch.mjs "$BASE_SHA" || exit "$identity_status"
            echo "branch scope: disposition branch, package rules do not apply"
            exit 0
          fi
          # `persist-credentials: false` means no fetch can authenticate, so the base has to
          # come from what the checkout already brought. With `fetch-depth: 0` the full history
          # is present and the merge-base of HEAD and the base branch is reachable by SHA --
          # which the pull_request event supplies directly.
          node scripts/verify-branch-scope.mjs "$BASE_SHA" "$package_id"

      # The database half, after `npm run check`, so a red suite fails first and this step's output
      # never has to be read to discover the repository is broken.
      #
      # DB_TEST_URL names the service container. It is not a secret: the container lives for the
      # length of this job, holds nothing, and is reachable from nowhere else. A real credential
      # would belong in repository secrets and would never appear in a workflow file.
      - name: Database foundation
        env:
          # The password is NOT in the URL. The secret scanner flags an inline database password
          # wherever it appears, and it was right to: this one is a throwaway container credential,
          # but a rule that makes exceptions for credentials someone judges harmless stops being a
          # rule. psql reads PGPASSWORD from the environment, so the URL carries no secret shape and
          # the scanner has nothing to match.
          PGPASSWORD: postgres
          DB_TEST_URL: postgresql://postgres@localhost:5432/thinkbizthai_test
        run: |
          # The shim first: the migrations reference auth.uid() and the platform roles, and a bare
          # Postgres has neither. It declares in its own header that it is not Supabase.
          psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -q -f db/foundation/ci/supabase-shim.sql
          LC_ALL=C TZ=UTC make db-migrate-clean
          LC_ALL=C TZ=UTC make db-schema-lint
          # The isolation cases. This is the step that turns "we measured it once" into "a
          # regression fails the build", which is the difference between a measurement and a
          # control. Read its output with the shim's header in mind: it proves the POLICIES, not
          # the platform.
          LC_ALL=C TZ=UTC make db-rls-smoke

      # The negative control. A green isolation suite is not evidence until the suite can be made
      # to go red, and everything this branch found was a case passing for a reason nobody had
      # checked: a driver that could not name a column, and a parser counting the `set_config` row
      # from assuming an identity as a visible tenant row. Twenty-one cases were "passing" through
      # both.
      #
      # So the last thing the job does is switch row level security OFF on one table and require
      # the suite to FAIL, naming a failed case rather than merely exiting non-zero -- a fixture
      # that did not load also exits non-zero, and would let this control pass while proving
      # nothing.
      #
      # It runs last because it mutates the database. The container is discarded with the job.
      # The negative control, one per table family rather than one for the repository.
      #
      # The single-table version reported "10 of 28" and then "10 of 76" — the SAME ten, because
      # every one of them names app.workspaces. Batch 020 added 41 cases and the control could not
      # tell a working business/page policy from a broken one: it disabled RLS on a table those
      # cases never touch. A control that grows stale as the suite grows is worse than none, because
      # its number keeps being reported as though it meant something.
      #
      # So each entry disables RLS on ONE table and requires a failed case whose id matches that
      # table's own pattern. Requiring the pattern is the whole point: "the suite failed" is
      # satisfied by any regression anywhere, including one this control did not cause.
      #
      # RLS is re-enabled after each entry, so the entries are independent. Without that, the second
      # control would pass on the first table still being off.
      - name: Negative control - each table family must be detectable on its own
        env:
          PGPASSWORD: postgres
          DB_TEST_URL: postgresql://postgres@localhost:5432/thinkbizthai_test
        run: |
          set -u
          fail() { echo "$1"; cat control.log; exit 1; }
          control() {
            table="$1"; pattern="$2"; batch="$3"
            psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -q -c "alter table $table disable row level security;"
            if LC_ALL=C TZ=UTC make db-rls-smoke > control.log 2>&1; then
              psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -q -c "alter table $table enable row level security;"
              fail "The isolation suite PASSED with row level security DISABLED on $table. Batch $batch's cases cannot detect the thing they exist to detect."
            fi
            psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -q -c "alter table $table enable row level security;"
            if ! grep -q 'db-rls-smoke: FAILED' control.log; then
              fail "The suite exited non-zero without reporting a failed isolation case. That is a broken run, not a detected regression, and it must not be read as this control passing."
            fi
            if ! grep -Eq "^  $pattern" control.log; then
              fail "The suite failed, but no case matching /$pattern/ did. Something failed; it was not $table. A control satisfied by any failure is satisfied by a regression it did not cause."
            fi
            # Count FAILED CASE LINES, which are `  <id> [covers] (phase): detail`. The first
            # version counted `^  .*(` and swept up the coverage report and the authz-proof lines
            # with them, so every number it printed was an upper bound presented as a count. A2
            # Industry found it by reading the output rather than the step. The control itself
            # greps ids and was never wrong; only the sentence about it was, which is the kind of
            # defect that survives longest.
            noticed=$(grep -Ec "^  [a-z0-9-]+ \[[^]]*\] \([a-z-]+\):" control.log)
            echo "  $table ($batch): $noticed case(s) noticed, including $(grep -Eo "^  $pattern[a-z0-9-]*" control.log | head -1 | tr -d ' ')"
          }
          echo "negative control: each table family must be detectable on its own"
          control app.workspaces              '[a-z0-9-]*workspace'  010
          control app.business_profiles       '[a-z0-9-]*business'   020
          control app.page_context_profiles   '[a-z0-9-]*page'       020
          # Batch 021's table, and the entry whose absence would have been the gap named above.
          # Disabling row level security here does not merely hide rows: every caller sees every
          # member's scope rows, so a narrowed member inherits somebody else's scope and stops being
          # narrowed, and the suspended member — who holds a scope row on purpose — starts seeing
          # one. `[a-z0-9-]*scope` is matched by both of those failures.
          control app.workspace_member_scopes '[a-z0-9-]*scope'      021
          # Batch 030's tenant table. Disabling row level security here lets tenant A read tenant B's
          # industry assignment, lets a member scoped to one Business read another Business's, and
          # lets a suspended member and the service identity read rows they must not see. Four cases
          # match the pattern and would fail.
          control app.industry_assignments    '[a-z0-9-]*industry-assignment' 030
          #
          # THE TWO GLOBAL TABLES, AND WHY AN ENTRY FOR THEM BITES AT ALL. Every entry above works
          # because disabling row level security dissolves a TENANT BOUNDARY and somebody sees
          # somebody else's rows. app.industry_packs and app.industry_pack_versions have no tenant
          # boundary to dissolve: they belong to no workspace, and batch 030 grants no client role
          # any privilege on them at all (RFC-2026-012 §2/3 — the read allowlist is empty and grows
          # only by RFC). Every client case against them is a PRIVILEGE-layer refusal, and disabling
          # row level security does not restore a grant nobody made, so none of those cases would
          # notice.
          #
          # What makes the entries bite is the one grant that does exist: `app_worker` holds SELECT
          # and NO POLICY, which is the shape batch 010 introduced so that a service denial is
          # attributable to row level security rather than to a forgotten GRANT. With RLS off, the
          # service reads the catalog and `service-sees-zero-*` fails. So each of these entries rests
          # on exactly ONE case rather than several — stated here rather than left to be discovered,
          # because a control resting on one case is one deletion away from resting on none, and
          # tests/db/identity/identity-isolation.test.mjs is what refuses that deletion.
          control app.industry_packs          '[a-z0-9-]*industry-pack-catalog'  030
          control app.industry_pack_versions  '[a-z0-9-]*published-pack-version' 030
          #
          # THE TWO KNOWLEDGE TABLES, AND WHAT EACH ENTRY ACTUALLY RESTS ON. Batch 030 recorded
          # that a global table's entry rests on ONE case, and said so because a control resting on
          # one case is one deletion away from resting on none. Neither of these does, and what each
          # rests on is named here rather than left to be counted from the suite.
          #
          # app.knowledge_items rests on SIX RLS-decided cases, and they fail for three different
          # reasons. Disabling row level security there lets tenant A read tenant B's knowledge —
          # which on this family is CONTENT-2, what a business SAYS rather than what it is called;
          # it lets a member scoped to one Business read another Business's knowledge; it lets a
          # member scoped to ONE PAGE read a sibling Page's, which no other table in this schema can
          # detect, because a knowledge row is the first that carries its own page scope; and it
          # lets the approver's refused UPDATE land, which the witness then sees.
          #
          # app.knowledge_item_versions rests on FIVE, and one of them is the reason that table is
          # shaped the way it is: its narrowing is not a copy of the item's predicate but the item's
          # own reachability, so `page-editor-a-cannot-see-the-knowledge-version-of-the-sibling-page`
          # is the case that fails if the version ever started answering from its own columns —
          # which it could not do correctly, since it carries no page column at all.
          #
          # The two patterns do not overlap: an item case id contains `knowledge-item` and a version
          # case id contains `knowledge-version`, and tests/db/identity/identity-isolation.test.mjs
          # asserts that no case matches both, so neither entry can be satisfied by the other
          # table's regression.
          #
          # BATCH 041 ADDS NO ENTRY, BECAUSE IT ADDS NO TABLE. It creates one function —
          # app.knowledge_scope_applies, the scope half of the resolution rule — and nothing that
          # row level security can be switched off on. Saying so here rather than nowhere is the
          # point: this step's own blocker is that nothing fails the build when a batch adds a table
          # and no entry, so "041 owes no entry" is a claim that should be visible at the place the
          # entries live. identity-isolation.test.mjs holds it, by requiring that NO control entry is
          # attributed to batch 041 and that the migration creates no table.
          #
          # WHAT 041 DOES CHANGE IS WHAT THE app.knowledge_items ENTRY RESTS ON. It adds four more
          # cases that fail with row level security disabled there, and they are worth naming
          # because they fail through a NEW PATH rather than for a new reason: each one runs the
          # resolution contract as a filter, the predicate answers TRUE for the row, and only the
          # policy set refuses. `owner-a-cannot-resolve-the-knowledge-item-of-business-b1` is the
          # tenant boundary, `page-editor-a-cannot-resolve-the-knowledge-item-of-the-sibling-page`
          # is member scope at Page granularity, and `suspended-a-resolves-zero-knowledge-items` and
          # `service-resolves-zero-knowledge-items` are the suspended member and the service.
          #
          # THAT PARAGRAPH WAS A DERIVATION WHEN IT WAS WRITTEN AND IS NOW A MEASUREMENT, read from
          # this step's own output: main at batch 040 reported `app.knowledge_items (040): 24
          # case(s) noticed` and this branch reports 28. EXACTLY +4, against +7 new `no-rows` cases
          # matching the pattern -- so the three predicate negatives really did not move it, which
          # is the half of the claim below that a reader would otherwise take on trust. And
          # app.knowledge_item_versions is UNCHANGED at 9, which is the other half: 041 asserts
          # nothing about that table, so an entry that had grown there would have meant a case
          # crediting a control it does not test.
          #
          # 041's OTHER THREE negatives are NOT part of this basis and must not be counted as
          # though they were: `owner-a-does-not-resolve-the-sibling-page-knowledge-item-for-page-a1`
          # and its two siblings are refused by the PREDICATE, not by row level security, so they
          # return nothing whether the table is forced or wide open. They are paired instead with a
          # statement that differs in exactly one argument and returns the row.
          control app.knowledge_items         '[a-z0-9-]*knowledge-item'    040
          control app.knowledge_item_versions '[a-z0-9-]*knowledge-version' 040
          #
          # THE THREE ASYNC-KERNEL TABLES, AND WHY EACH ENTRY RESTS ON EXACTLY TWO CASES. Batch 030
          # recorded that a global table's entry rests on ONE case and said so because a control
          # resting on one case is one deletion away from resting on none. These three are the same
          # shape for a different reason and land on two rather than one, which is stated here
          # rather than left to be counted from the suite.
          #
          # Batch 050 grants NO CLIENT ROLE ANYTHING on any of its three tables: §8.4's "Job
          # redacted status SELECT" grants a REDACTED STATUS, which is a security_invoker view on
          # the read allowlist RFC-2026-012 §3 and RFC-2026-021 give to an RFC, and the outbox and
          # the consumer ledger have no row in §8 at all. So every client case against them is a
          # PRIVILEGE-layer refusal and disabling row level security restores no grant nobody made.
          #
          # What makes each entry bite is the pair of grants that DOES exist: app_worker holds
          # SELECT and INSERT (and, on app.jobs, UPDATE) with NO POLICY, which is the shape batch
          # 010 introduced so that a service denial is attributable to row level security rather
          # than to a forgotten GRANT. With RLS off, `service-sees-zero-*` returns the row AND
          # `service-cannot-*` succeeds where it must be refused — a filtered read and a policy-layer
          # write refusal, which are the two outcomes disabling RLS actually changes. A `denied`
          # case whose layer is `grant` would pass unchanged and is not counted by
          # tests/db/identity/identity-isolation.test.mjs, which pins these six cases by id.
          #
          # The three patterns do not overlap — a job case id contains `job-row`, an outbox case id
          # `outbox-event` and a ledger case id `consumer-ledger` — and that test asserts no case
          # matches two of them, so no entry can be satisfied by another table's regression.
          control app.jobs                    '[a-z0-9-]*job-row'         050
          control app.outbox_events           '[a-z0-9-]*outbox-event'    050
          control app.consumer_ledger         '[a-z0-9-]*consumer-ledger' 050
          # THE TWO AI GATEWAY TABLES IN `app`, AND THE THIRD TABLE THAT DELIBERATELY HAS NO ENTRY.
          # Batch 060 writes NO POLICY on any table it creates: §8 has no row for a model registry
          # or a model policy, so there is no cell to implement, and RFC-2026-012 with RFC-2026-021
          # puts the client read behind an allowlist that is empty. Every client case on these
          # tables is therefore a PRIVILEGE-layer refusal, which disabling row level security does
          # not restore — the same situation batch 030's two global tables are in.
          #
          # app.ai_models rests on ONE case, `service-sees-zero-rows-in-the-ai-model-registry`, for
          # 030's reason: app_worker holds SELECT and no policy, so that read is the only thing row
          # level security decides on the table. Stated here rather than left to be discovered,
          # because a control resting on one case is one deletion away from resting on none.
          #
          # app.ai_model_policies rests on TWO, and the second is a shape no earlier entry has.
          # `service-sees-zero-ai-model-policy-rows` is a filtered read. `service-cannot-set-an-ai-
          # model-policy` is a `denied` case refused at the POLICY layer — app_worker holds the
          # INSERT grant, so FORCE ROW LEVEL SECURITY with an empty policy set is what refuses the
          # row. Disabling row level security removes exactly that refusal: the 42501 the case
          # demands is gone, the statement is stopped (if at all) by the primary key with a
          # different SQLSTATE, and the case fails either way. Every other `denied` case in the
          # suite is a grant-layer refusal and would pass unchanged;
          # tests/db/identity/identity-isolation.test.mjs counts this one and says why.
          #
          # THERE IS NO ENTRY FOR private.ai_credential_references, AND THE ABSENCE IS THE FINDING
          # RATHER THAN AN OVERSIGHT. No role holds any privilege on that table — not a client role,
          # not app_worker — because RFC-2026-012's inventory says "no read by anyone, including
          # service" and §8.3's "Plain credential SELECT" is N in every column. Disabling row level
          # security there restores no grant, so no case would fail and this step's own first
          # failure message ("The isolation suite PASSED with row level security DISABLED") would
          # fire on a correct database. An entry that cannot bite reports a pass it did not earn.
          # The static suite asserts the absence IN BOTH DIRECTIONS: no entry while no migration
          # grants anything on that table, and an entry REQUIRED the moment one does.
          control app.ai_models               '[a-z0-9-]*ai-model-registry' 060
          control app.ai_model_policies       '[a-z0-9-]*ai-model-policy'   060
          echo "negative control: every family above failed the suite, as each must."
